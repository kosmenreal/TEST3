<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Position size calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1418;
    --panel: #0f1a1f;
    --field: #0f1a1f;
    --line: #273238;
    --line-focus: #50d2c1;
    --text: #ffffff;
    --muted: #8f9b9e;
    --accent: #50d2c1;
    --bad: #ed7088;
    --green: #5fd38a;
    --orange: #f0a04b;
    --good: #50d2c1;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .wrap {
    display: grid;
    grid-template-columns: minmax(220px, 260px) minmax(300px, 440px);
    gap: 28px;
    align-items: start;
    width: 100%;
    max-width: 740px;
  }
  @media (max-width: 680px) { .wrap { grid-template-columns: 1fr; } }
  aside { order: -1; }

  .col { display: flex; flex-direction: column; gap: 12px; }
  .row { display: grid; gap: 12px; }
  .row.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

  .field {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    height: 44px; padding: 0 14px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: text;
    transition: border-color .12s;
  }
  .field:focus-within { border-color: var(--line-focus); }
  .field > span.label { color: var(--muted); white-space: nowrap; }
  .field input, .field select {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: 0;
    color: var(--text); font: inherit; font-weight: 600;
    text-align: right;
  }
  .field input::placeholder { color: #4b595d; font-weight: 400; }
  .field.out { cursor: default; }
  .field.out .value { flex: 1; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .field.out .value.empty { color: #4b595d; font-weight: 400; }
  .field.copyable { cursor: copy; }
  .field.copyable:hover { border-color: #3a484e; }
  .field .unit { color: var(--text); font-weight: 600; }
  .field select { flex: 0 0 auto; width: auto; text-align: right; cursor: pointer; appearance: none; padding-right: 2px; }
  .field select option { background: var(--panel); }
  .chev { width: 10px; height: 10px; stroke: var(--muted); fill: none; stroke-width: 1.6; flex: none; }
  .tag { color: var(--accent); font-weight: 500; font-size: 13px; }

  .field.g { background: rgba(95,211,138,.07); border-color: rgba(95,211,138,.38); }
  .field.g:focus-within { border-color: var(--green); }
  .field.g > span.label { color: #8fc9a5; }
  .field.o { background: rgba(240,160,75,.07); border-color: rgba(240,160,75,.40); }
  .field.o > span.label { color: #d4a874; }
  .field.o .value:not(.empty) { color: var(--orange); }
  .field.o.copyable:hover { border-color: var(--orange); }

  .field.big { height: 52px; }
  .field.big input, .field.big .value { font-size: 18px; }
  @media (max-width: 680px) {
    body { padding: 20px 14px 40px; }
    .field input, .field select { font-size: 16px; }
    .field.big {
      display: grid; grid-template-columns: 1fr auto; grid-template-areas: "l l" "v u";
      align-content: center; align-items: end; row-gap: 4px;
      height: auto; min-height: 92px; padding: 12px 16px;
    }
    .field.big > .label { grid-area: l; font-size: 16px; align-self: start; }
    .field.big > input, .field.big > .value { grid-area: v; text-align: left; font-size: 32px; line-height: 1.15; }
    .field.big > .unit { grid-area: u; font-size: 26px; line-height: 1.15; }
    .field.big > label { grid-area: u; align-self: end; }
    .field.big select { font-size: 24px; }
    .field.big .chev { width: 14px; height: 14px; }
  }

  /* Phone: order is top fields, account, copy bar, then the stats far below */
  @media (max-width: 680px) {
    .wrap { display: flex; flex-direction: column; gap: 22px; }
    .ticket { display: contents; }
    .topgroup { order: 1; gap: 14px; }
    aside { order: 2; }
    .copybar { order: 3; margin-top: 0; }
    .stats { order: 4; margin-top: 140px; }
  }

  .field.bad { border-color: var(--bad); }
  .field.bad > span.label { color: var(--bad); }
  .field.g.bad { background: rgba(237,112,136,.07); border-color: var(--bad); }

  .gain { color: var(--good) !important; }
  .loss { color: var(--bad) !important; }

  .stats {
    margin-top: 6px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
    display: grid; gap: 9px;
  }
  .stat { display: flex; justify-content: space-between; color: var(--muted); }
  .stat b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }

  .copybar { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 12px; }
  .copybar .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .btn {
    height: 34px; padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
    font: inherit; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover:not(:disabled) { background: rgba(80,210,193,.1); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .combo { position: relative; }
  .chevbtn { background: none; border: 0; padding: 4px; margin-right: -4px; cursor: pointer; display: flex; }
  .menu {
    position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px);
    margin: 0; padding: 4px; list-style: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .menu[hidden] { display: none; }
  .menu li { padding: 9px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .menu li:hover, .menu li:focus { background: rgba(80,210,193,.12); outline: 0; }
  .side-title { color: var(--muted); font-size: 13px; padding: 0 2px; }
  .hint { color: var(--muted); font-size: 12.5px; padding: 0 2px; line-height: 1.5; }
  .note { min-height: 18px; color: var(--bad); font-size: 12.5px; padding: 0 2px; }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--accent); color: #04211d; font-weight: 600;
    padding: 8px 14px; border-radius: 8px; opacity: 0; pointer-events: none;
    transition: opacity .15s, transform .15s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  @media (prefers-reduced-motion: reduce) { .toast, .field { transition: none; } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main class="wrap">

  <!-- Order ticket -->
  <section class="col ticket" aria-label="Order">
  <div class="col topgroup">
    <label class="field g big">
      <span class="label">Entry price (USDC)</span>
      <input id="entry" inputmode="decimal" autocomplete="off" placeholder="0">
    </label>

    <div class="field out copyable o big" id="sizeBox" title="Click to copy">
      <span class="label">Size</span>
      <span class="value empty" id="size">–</span>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
        <select id="coin" aria-label="Coin">
          <option>BTC</option><option>ETH</option><option>SOL</option>
        </select>
        <svg class="chev" viewBox="0 0 10 10"><path d="M1 3l4 4 4-4"/></svg>
      </label>
    </div>

    <div class="row two">
      <label class="field g big" id="tpBox">
        <span class="label">TP price</span>
        <input id="tp" inputmode="decimal" autocomplete="off" placeholder="">
      </label>
      <div class="field out big">
        <span class="label">Gain</span>
        <span class="value empty" id="gain">–</span>
        <span class="unit">%</span>
      </div>
    </div>

    <div class="row two">
      <div class="field out copyable o big" id="adjBox" title="Click to copy">
        <span class="label">Adjusted SL</span>
        <span class="value empty" id="adj">–</span>
      </div>
      <label class="field g big" id="slBox">
        <span class="label">SL price</span>
        <input id="sl" inputmode="decimal" autocomplete="off" placeholder="">
      </label>
    </div>

    <div class="note" id="note" role="status"></div>
  </div>


    <div class="copybar">
      <div class="row two">
        <label class="field">
          <span class="label">Coin</span>
          <input id="coinText" autocomplete="off" aria-label="Coin text for the copied row">
        </label>
        <div class="field combo" id="sysBox">
          <span class="label">System</span>
          <input id="system" autocomplete="off" value="5. BTC 1H UND OVR" aria-label="System text for the copied row">
          <button type="button" class="chevbtn" id="sysToggle" aria-label="Choose a system" aria-haspopup="listbox" aria-expanded="false">
            <svg class="chev" viewBox="0 0 10 10"><path d="M1 3l4 4 4-4"/></svg>
          </button>
          <ul class="menu" id="sysMenu" role="listbox" hidden>
            <li role="option" tabindex="0">5. BTC 1H UND OVR</li>
            <li role="option" tabindex="0">7. ETH 1h MEAN REV</li>
          </ul>
        </div>
      </div>
      <div class="foot">
        <button class="btn" id="copyRow" type="button" disabled>
          <svg viewBox="0 0 14 14"><rect x="4.5" y="4.5" width="8" height="8" rx="1.5"/><path d="M9.5 2.5v-.2a.8.8 0 0 0-.8-.8H2.3a.8.8 0 0 0-.8.8v6.4a.8.8 0 0 0 .8.8h.2"/></svg>
          Copy row
        </button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span>Expected loss at adjusted SL</span><b id="expLoss">–</b></div>
      <div class="stat"><span>Position size (notional)</span><b id="notional">–</b></div>
      <div class="stat"><span>Min. leverage for portfolio</span><b id="lev">–</b></div>
      <div class="stat"><span>Initial margin at that leverage</span><b id="margin">–</b></div>
    </div>
  </section>

  <!-- Side panel -->
  <aside class="col" aria-label="Account">
    <div class="side-title">Account</div>
    <label class="field">
      <span class="label">Portfolio</span>
      <input id="portfolio" inputmode="decimal" autocomplete="off" placeholder="0" value="905">
    </label>
    <label class="field">
      <span class="label">Risk</span>
      <input id="risk" inputmode="decimal" autocomplete="off" placeholder="0" value="9.05">
    </label>
    <div class="hint" id="riskPct">1% of portfolio is 9,05</div>
  </aside>
</main>
<div class="toast" id="toast">Copied</div>

<script>
const $ = id => document.getElementById(id);
const num = s => {
  const v = parseFloat(String(s).replace(/['’\s]/g, '').replace(',', '.'));
  return isFinite(v) ? v : NaN;
};
const decs = s => { const m = String(s).replace(/['’]/g, '').replace(',', '.').split('.')[1]; return m ? m.length : 0; };
const fmt = (v, d) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/,/g, "'");

// Same normalisation as the sheet: notional mapped on a log scale between 1 and 1,000,000, reversed.
const NOTIONAL_MIN = 1, NOTIONAL_MAX = 1e6, SL_FACTOR = 1.6;
const AMOUNT_DECIMALS = { BTC: 5, ETH: 4, SOL: 2 };

let coinTouched = false, coinTextTouched = false, state = null;

function setOut(id, text, cls) {
  const el = $(id);
  el.textContent = text;
  el.classList.toggle('empty', text === '–');
  el.classList.remove('gain', 'loss');
  if (cls) el.classList.add(cls);
}

function clearOutputs() {
  ['size', 'adj', 'gain'].forEach(id => setOut(id, '–'));
  ['expLoss', 'notional', 'lev', 'margin'].forEach(id => $(id).textContent = '–');
}

function calc() {
  const entry = num($('entry').value), sl = num($('sl').value), tp = num($('tp').value);
  const risk = num($('risk').value), pf = num($('portfolio').value);
  const note = $('note');
  note.textContent = '';
  state = null;
  ['tpBox', 'slBox'].forEach(i => $(i).classList.remove('bad'));

  // Auto-pick coin from entry price (like the sheet) until the user picks one
  if (!coinTouched && entry > 0) $('coin').value = entry < 1000 ? 'SOL' : entry < 30000 ? 'ETH' : 'BTC';

  if (!coinTextTouched) $('coinText').value = $('coin').value;

  $('riskPct').textContent = pf > 0
    ? '1% of portfolio is ' + String(Number((pf * 0.01).toFixed(4))).replace('.', ',')
    : '1% of portfolio is –';

  const long = entry > sl;

  // Take profit side check + gain
  if (entry > 0 && tp > 0) {
    const g = (tp - entry) / entry * 100 * (long ? 1 : -1);
    setOut('gain', (g >= 0 ? '+' : '') + fmt(g, 2), g >= 0 ? 'gain' : 'loss');
    if (sl > 0 && g < 0) {
      $('tpBox').classList.add('bad');
      note.textContent = long ? 'Take profit should be above entry for a long.' : 'Take profit should be below entry for a short.';
    }
  } else setOut('gain', '–');

  if (!(entry > 0 && sl > 0 && risk > 0)) { ['size', 'adj'].forEach(id => setOut(id, '–')); clearOutputs2(); return; }
  if (entry === sl) {
    $('slBox').classList.add('bad');
    note.textContent = 'Stop loss can’t equal the entry price.';
    clearOutputs(); return;
  }

  const dist = Math.abs(entry - sl);
  const amount = risk / dist;                 // amount of coin
  const notional = amount * entry;            // position size in USDC
  const dir = Math.sign(entry - sl);          // +1 long, -1 short

  const coin = $('coin').value;
  setOut('size', fmt(amount, AMOUNT_DECIMALS[coin]));
  $('notional').textContent = fmt(notional, 2) + ' USDC';

  // Adjusted stop loss
  let adjVal = null, expRatio = null;
  const norm = (Math.log10(notional) - Math.log10(NOTIONAL_MAX)) / (Math.log10(NOTIONAL_MIN) - Math.log10(NOTIONAL_MAX));
  if (!(norm > 0)) {
    setOut('adj', '–');
    $('expLoss').textContent = '–';
    note.textContent = 'Position is 1,000,000 USDC or more – adjusted SL is out of the sheet’s range.';
  } else {
    const factor = Math.pow(1 / norm, 2) / 100 * SL_FACTOR;
    const adj = sl + dir * dist * factor;
    adjVal = adj;
    const d = Math.min(6, Math.max(2, decs($('sl').value), decs($('entry').value)));
    setOut('adj', fmt(adj, d));
    const expected = (entry - adj) / (entry - sl);
    expRatio = expected;
    $('expLoss').textContent = fmt(expected * 100, 1) + '% of risk (' + fmt(expected * risk, 2) + ' USDC)';
    if (factor >= 1 && !note.textContent) note.textContent = 'Adjusted SL has moved past your entry price.';
  }

  state = { amount, risk, portfolio: pf > 0 ? pf : null, sl, exp: expRatio, adj: adjVal };

  if (pf > 0) {
    const lev = notional / pf, rounded = Math.ceil(lev);
    $('lev').textContent = rounded + 'x (' + fmt(lev, 2) + 'x exact)';
    $('margin').textContent = fmt(notional / rounded, 2) + ' USDC';
  } else { $('lev').textContent = '–'; $('margin').textContent = '–'; }
}
function clearOutputs2() { ['expLoss', 'notional', 'lev', 'margin'].forEach(id => $(id).textContent = '–'); }

// Live thousands grouping while typing (65000 -> 65'000), caret kept in place
function group(el) {
  const raw = el.value, pos = el.selectionStart ?? raw.length;
  let sig = 0;
  for (let i = 0; i < pos; i++) if (raw[i] !== "'" && raw[i] !== '’') sig++;
  const clean = raw.replace(/['’\s]/g, '').replace(/[^0-9.,]/g, '');
  const m = clean.search(/[.,]/);
  let int = m < 0 ? clean : clean.slice(0, m);
  const frac = m < 0 ? '' : clean.slice(m, m + 1) + clean.slice(m + 1).replace(/[.,]/g, '');
  const out = int.replace(/\B(?=(\d{3})+(?!\d))/g, "'") + frac;
  if (out === raw) return;
  el.value = out;
  let n = 0, k = 0;
  while (k < out.length && n < sig) { if (out[k] !== "'") n++; k++; }
  try { el.setSelectionRange(k, k); } catch (e) {}
}
['entry', 'sl', 'tp', 'risk', 'portfolio'].forEach(id => {
  $(id).addEventListener('input', () => { group($(id)); calc(); });
});
$('coin').addEventListener('change', () => { coinTouched = true; calc(); });

// Click an output to copy its value
function copyOf(boxId, valId) {
  $(boxId).addEventListener('click', () => {
    const t = $(valId).textContent;
    if (t === '–') return;
    const raw = t.replace(/'/g, '');
    (navigator.clipboard ? navigator.clipboard.writeText(raw) : Promise.reject()).catch(() => {
      const ta = document.createElement('textarea'); ta.value = raw; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
    });
    const toast = $('toast'); toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 900);
  });
}
copyOf('sizeBox', 'size');
copyOf('adjBox', 'adj');

// Copy the I3:Q3 row (tab-separated, so it pastes into nine cells)
const pad = n => String(n).padStart(2, '0');
function nowStamp() {               // m/d/yyyy h:mm:ss, like the sheet's NOW() cell
  const d = new Date();
  return `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()} ${d.getHours()}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function showToast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1100);
}
$('coinText').addEventListener('input', () => {
  coinTextTouched = $('coinText').value.trim() !== '';
  if (!coinTextTouched) $('coinText').value = $('coin').value;   // cleared -> back to automatic
});
$('copyRow').addEventListener('click', () => {
  if (!state) return;
  const sep = ',';
  const fx = (v, d) => v == null ? '' : v.toFixed(d).replace('.', sep);   // fixed decimals
  const gen = v => v == null ? '' : String(v).replace('.', sep);          // "General"
  const row = [
    nowStamp(),                         // I  current time
    $('coinText').value,                // J  coin
    $('system').value,                  // K  system
    fx(state.amount, 5),                // L  amount of coin
    gen(state.risk),                    // M  risk
    fx(state.exp, 2),                   // N  expected loss
    gen(state.portfolio),               // O  portfolio
    gen(state.sl),                      // P  stop loss price
    fx(state.adj, 2)                    // Q  adjusted stop loss
  ].join('\t');
  (navigator.clipboard ? navigator.clipboard.writeText(row) : Promise.reject()).catch(() => {
    const ta = document.createElement('textarea'); ta.value = row; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  });
  showToast('Row copied');
});
// System dropdown (still a normal text field you can overwrite)
const sysMenu = $('sysMenu'), sysToggle = $('sysToggle');
const setMenu = open => { sysMenu.hidden = !open; sysToggle.setAttribute('aria-expanded', open); };
sysToggle.addEventListener('click', e => { e.stopPropagation(); setMenu(sysMenu.hidden); });
sysMenu.querySelectorAll('li').forEach(li => {
  const pick = () => { $('system').value = li.textContent; setMenu(false); $('system').focus(); };
  li.addEventListener('click', pick);
  li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } if (e.key === 'Escape') setMenu(false); });
});
document.addEventListener('click', e => { if (!$('sysBox').contains(e.target)) setMenu(false); });
$('system').addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

const _calc = calc;
calc = function () { _calc(); $('copyRow').disabled = !state; };

calc();
</script>
</body>
</html>
